# ==============================================================================
# 🆘 INTERACTIVE HELP SYSTEM
# ==============================================================================
# ✅ Solo las entradas de AYUDA van aquí. NO las de system-messages.
help-system:
  general-header: "&6&l=== CustomDeathMessages Help ==="
  general-description: "&eCustomize death messages, sounds, particles, and more."
  general-usage: "&7Use &f/cdm help <command> &7to see details about a specific command."

  commands:
    test-desc: "Test a death message with a specific cause."
    reload-desc: "Reload config.yml and messages.yml without restarting."
    config-validate-desc: "Check if your configuration is valid."
    broadcast-desc: "Test broadcast modes for sounds, particles and messages."
    help-desc: "Show this help message."

  command-details:
    test:
      title: "&6&lCommand: /cdm test"
      description: "Simulates a death to preview how the message will look."
      usage: "/cdm test <cause> [killer] [source]"
      permission: "cdm.test"

    reload:
      title: "&6&lCommand: /cdm reload"
      description: "Reload all configuration files."
      usage: "/cdm reload"
      permission: "cdm.reload"

    "config validate":
      title: "&6&lCommand: /cdm config validate"
      description: "Validates your current configuration."
      usage: "/cdm config validate"
      permission: "cdm.reload"

    broadcast:
      title: "&6&lCommand: /cdm broadcast"
      description: "Tests broadcast modes for sounds, particles and messages."
      usage: "/cdm broadcast <sound|particle|message|test|modes|global>"
      permission: "cdm.broadcast"

    help:
      title: "&6&lCommand: /cdm help"
      description: "Shows general or specific help."
      usage: "/cdm help [command]"
      permission: "cdm.use"

  unknown-command: "&cCommand '&f{command}&c' not found. Use &f/cdm help&c to see the list."

# ==============================================================================
# 👥 GROUPS
# ==============================================================================
groups:
  default:
    default-messages:
      - "&c{victim} has met their end."
      - "&4{victim} just became a statistic."
    cause-messages:
      ENTITY_ATTACK:
        - "&c{victim} &4was massacred by &c{killer_name}&4."
        - "&4&lBRUTAL! &c{killer_name} &4eliminated &c{victim}&4."
      FALL:
        - "&c{victim} fell to their doom!"
        - "&c{victim} forgot how to fly."
      FIRE: "&c{victim} &4turned into a human torch."

  vip:
    death-sound: entity.player.levelup
    sound-volume: 1.2
    sound-pitch: 1.5
    default-messages:
      - "&6✧ &e{victim} has fallen! &6✧"
      - "&6✧ &eRIP &e{victim} &6✧"
    cause-messages:
      FALL:
        - "&6✧ &e{victim} &6✧ &emade a forced landing."
        - "&6✧ &e{victim} &6✧ &etried skydiving without a parachute."

  admin:
    death-sound: entity.wither.spawn
    sound-volume: 2.0
    sound-pitch: 0.8
    default-messages: "&4[ADMIN] &c{victim} has died. Cause: {cause}"
    cause-messages:
      ENTITY_ATTACK: "&4[ADMIN] &c{victim} &4was eliminated by &c{killer_name} &4({cause})"

